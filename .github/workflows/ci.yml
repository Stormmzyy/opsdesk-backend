# Continuous integration: builds the backend and runs every test, on a clean
# Linux machine, for each push to main and each pull request.
#
# What a clean machine catches that this laptop can't: a file that exists
# here but was never committed, an environment variable only set here, and
# anything that only works on Windows.
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow only checks out the code and builds it.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going
# for the older one, since only the newest result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job's name is the status check's name ("verify"). Branch protection
  # will refer to it by that name, so keep it stable.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # JDK 21: pom.xml's enforcer rule refuses to build on anything older.
      # cache: maven keeps ~/.m2 between runs, keyed on pom.xml, so the
      # dependencies are downloaded again only when pom.xml changes.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify compiles, runs every test and packages the JAR.
      #
      # No database service here, and none is needed: the tests run against
      # an in-memory H2 database under the test profile (decision 62, Week 7
      # Friday), so CI needs no PostgreSQL, no Docker and no secrets. The
      # PostgreSQL-only behaviour is checked by the walk, by hand.
      #
      # -B: batch mode, without the progress output meant for a terminal.
      - name: Build and test
        run: ./mvnw -B verify

  # Builds the Docker image, so a broken Dockerfile or .dockerignore turns CI
  # red instead of waiting for someone to run compose by hand. A separate job
  # runs in parallel with "verify", so a slow image build never holds up the
  # test result; it's its own status check, "image".
  #
  # NOT COVERED, and only checked by hand (opsdesk-system PR #1 records how):
  # nothing here runs docker compose, so the three services starting
  # together, the database healthcheck and depends_on, the backend's
  # healthcheck, and the data surviving in the volume are not tested by CI.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile builds the JAR itself, on JDK 21, so this job needs no
      # setup-java. It never pushes the image anywhere.
      - name: Build the Docker image
        run: docker build -t opsdesk-backend:ci .

      # A build only proves the image can be assembled: it never starts the
      # JAR, so a wrong ENTRYPOINT would still build. This starts it with NO
      # settings, which needs no database: it must exit non-zero with the
      # report naming DB_URL (decision 68). That proves Java runs, the JAR
      # loads, Spring starts, and the image refuses to run unconfigured.
      - name: Start the image without settings, and expect it to refuse
        run: |
          set +e
          output=$(docker run --rm opsdesk-backend:ci 2>&1)
          status=$?
          set -e
          echo "$output" | tail -n 8
          if [ "$status" -eq 0 ]; then
            echo "::error::The image started with no settings. It must refuse."
            exit 1
          fi
          if ! echo "$output" | grep -q "DB_URL is not set"; then
            echo "::error::The image failed, but not with the missing-setting report naming DB_URL."
            exit 1
          fi
