# Production: read with SPRING_PROFILES_ACTIVE=prod, on top of application.yml.
#
# WHY THIS FILE IS NEARLY EMPTY: application.yml already IS the production
# configuration. The base file holds production's rules (every secret and
# database setting required, no seeder) so that a run that forgets its profile
# gets production's rules too, never development's (decision 68). This file
# only adds what production does differently on top of that.
#
# What this file deliberately does NOT do is give anything a default. These
# come from application.yml, where they have no usable default, so a
# production start without them fails at startup instead of running with a
# guessable value (.env.example lists them, with fake values):
#   DB_URL          e.g. jdbc:postgresql://db:5432/opsdesk inside Docker
#   DB_USER
#   DB_PASSWORD
#   JWT_SECRET      a random value of at least 32 characters
#   ALLOWED_ORIGIN  e.g. http://localhost:3000, no trailing slash
#
# No seeder: SampleDataSeeder runs only under dev and test (decision 69), so a
# new production database starts with no users. The first admin is created
# by registering and promoting that account with SQL (README).
#
# Only settings that differ from the shared ones go here: no SQL, and the
# logging levels below (decision 72).
spring:
  jpa:
    # Never print SQL in production: statements can carry user data.
    show-sql: false

# Logging, stated explicitly so nobody has to work out what production gets:
# INFO for this application, no SQL, and no DEBUG anywhere. Investigating a
# problem in production means raising one logger for a while, never this
# whole file (decision 72: DEBUG switched on in production is the day every
# password from every login would reach the log, if anything logged bodies).
logging:
  level:
    com.opsdesk.backend: INFO
    org.hibernate.SQL: WARN
